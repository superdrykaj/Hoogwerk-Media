# Fly.io-configuratie. Pas "app" aan naar de naam die je zelf kiest.
app = "hoogbeeld-media"
primary_region = "ams"

# Wisselgeheugen: 512 MB werkgeheugen is krap als Next.js tegelijk
# afbeeldingen aan het verkleinen is. Dit voorkomt dat de machine omvalt.
swap_size_mb = 512

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  # Zet op "false" zodra de voorbeeldgegevens door je eigen inhoud zijn vervangen.
  DEMO_MODE = "true"
  # "soon" = bezoekers zien alleen "binnenkort online"; jij ziet als ingelogde
  # beheerder de volledige site. Zet op "live" om de deur open te zetten.
  SITE_STATUS = "soon"
  # Het publieke adres. Hiermee worden canonieke links, hreflang en de sitemap
  # opgebouwd. Staat dit er niet, dan leidt de site het af uit het verzoek —
  # maar vastzetten is betrouwbaarder. Pas dit aan als je domein wijzigt.
  NEXT_PUBLIC_SITE_URL = "https://hoogbeeldmedia.nl"

# Blijvende schijf: hier staan de database en de geüploade foto's.
# Zonder deze schijf is alles na een herstart weg.
#
# LET OP: draai hier altijd precies ÉÉN machine. Bij twee machines krijgt
# elke machine een eigen schijf, dus een eigen database. Boekingen komen dan
# willekeurig in de ene of de andere terecht. Controleer met `fly status`.
[mounts]
  source = "hoogbeeld_media_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Eén machine, omdat SQLite en de uploads op één schijf staan.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
