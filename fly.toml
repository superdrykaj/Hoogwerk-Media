# Fly.io-configuratie. Pas "app" aan naar de naam die je zelf kiest.
app = "hoogbeeld-media"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  # Zet op "false" zodra de voorbeeldgegevens door je eigen inhoud zijn vervangen.
  DEMO_MODE = "true"

# Blijvende schijf: hier staan de database en de geüploade foto's.
# Zonder deze schijf is alles na een herstart weg.
[mounts]
  source = "hoogbeeld_media_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Eén machine, omdat SQLite en de uploads op één schijf staan.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
